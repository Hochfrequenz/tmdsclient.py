name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # The job id "black" and the matrix values "black"/"isort" are kept unchanged (with the "tool" key still driving
  # the required-status-check names "black (black)" / "black (isort)") even though both now run ruff under the
  # hood, because those exact check names are pinned as required status checks in the branch protection rules.
  # Renaming them requires updating branch protection in the same change; this workflow intentionally keeps the
  # now-inaccurate labels instead.
  black:
    name: "black (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: "black"
            command: "ruff format --check ."
          - tool: "isort"
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --group linting ${{ matrix.command }}
